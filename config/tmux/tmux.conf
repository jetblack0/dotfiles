################################# Meta
# set -g default-terminal "tmux-256color"
# set -ag terminal-overrides ",foot:Tc"
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-kitty:Tc"

# terminal file manager preview
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -s extended-keys on
set -g focus-events on
set -as terminal-features 'xterm*:extkeys'

set -g set-clipboard on


################################# Plugins and colorscheme
source ~/.config/tmux/themes/gruvbox/base16-gruvbox-dark-hard.conf


################################# Keybinding
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind b set-option -g status
bind r source-file ~/.config/tmux/tmux.conf

# avoid ESC delay
set -s escape-time 1
set -g base-index 1
setw -g pane-base-index 1

# mouse works as expected
set -g mouse on

setw -g monitor-activity on
set -g visual-activity off

set -g mode-keys vi
set -g history-limit 10000

# clean screen
# bind C-l send-keys 'C-l'

# y and p as in vim
bind Escape copy-mode
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
# to the privous and next prompt
bind-key -T copy-mode-vi '.' send -X search-forward "󱙝 "
bind-key -T copy-mode-vi ',' send -X search-backward "󱙝 "
# bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# better way to split pane and open them in the same directory (it will follow link, doesn't matter)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# moving between window
bind N prev

# resize panes
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Send commands to all panels, useful for managing server clusters. 
bind y setw synchronize-panes on \; display-message "Sync ON"
bind Y setw synchronize-panes off \; display-message "Sync OFF"

bind-key g display-popup -d '#{pane_current_path}' -w 80% -h 80% -E "lazygit"
bind-key s display-popup -d '#{pane_current_path}' -w 60% -h 60% -E "$SHELL"
bind-key S display-popup -d '$HOME/Documents/learning/notes' -w 60% -h 60% -E "cd ~/Documents/learning/notes && nvim quick-note.md"



################################# Plugins
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'

# bind-key -n 'M-1' if -F "#{@pane-is-vim}" 'send-keys M-1' 'resize-pane -L 3'
# bind-key -n 'M-2' if -F "#{@pane-is-vim}" 'send-keys M-2' 'resize-pane -D 3'
# bind-key -n 'M-3' if -F "#{@pane-is-vim}" 'send-keys M-3' 'resize-pane -U 3'
# bind-key -n 'M-4' if -F "#{@pane-is-vim}" 'send-keys M-4' 'resize-pane -R 3'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if -F \"#{@pane-is-vim}\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if -F \"#{@pane-is-vim}\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
