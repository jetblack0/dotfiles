# Gruvbox (dark, hard) -- transparent, ASCII-only, no duplicated facts.

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5                 # keep the clock honest to within 5s

# --- the bar itself: fully transparent ------------------------------------
set -g status-style "bg=default,fg=#a89984"
set -g status-left-style default
set -g status-right-style default
set -g status-left-length 40
set -g status-right-length 80

# --- left: session name ---------------------------------------------------
set -g status-left "#[default] #[fg=#1d2021,bg=#D19097,bold] #S #[default]"

# --- middle: windows -----------------------------------------------------
set -g window-status-style "bg=default,fg=#a89984"
set -g window-status-format " #I #W#{?window_zoomed_flag, Z,} "
set -g window-status-current-style "bg=#504945,fg=#d5c4a1,bold"
set -g window-status-current-format " #I #W#{?window_zoomed_flag, Z,} "
set -g window-status-separator ""
set -g window-status-activity-style "bg=default,fg=#d5c4a1"
set -g window-status-bell-style "bg=#fb4934,fg=#1d2021,bold"

# --- right: directory | time | pane count ---------------------------------
set -g status-right "#[fg=#ebdbb2,bg=#3c3836] #{=/-45/...:#{s|^#{HOME}|~|:pane_current_path}} #[fg=#d5c4a1,bg=#504945] %H:%M #[fg=#1d2021,bg=#D19097,bold] #{window_panes}p #[default] "

# --- everything else ------------------------------------------------------
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#665c54"
set -g message-style "bg=#504945,fg=#ebdbb2"
set -g message-command-style "bg=#504945,fg=#ebdbb2"
set -g mode-style "bg=#504945,fg=#fabd2f"
set -g display-panes-colour "#665c54"
set -g display-panes-active-colour "#fabd2f"
setw -g clock-mode-colour "#83a598"
