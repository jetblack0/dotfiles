[mgr]
cwd = { fg = "magenta", bold = true }
syntect_theme = "~/.config/bat/themes/gruvbox-dark.tmTheme"

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#2A273F", bg = "#2A273F" }

# Progress
progress_label = { fg = "#e0def4", bold = true }
progress_normal = { fg = "#191724", bg = "#2A273F" }
progress_error = { fg = "#B4637A", bg = "#2A273F" }

# Permissions
perm_type = { fg = "#fcf0f6" }
perm_read = { fg = "#fcf0f6" }
perm_write = { fg = "#fcf0f6" }
perm_exec = { fg = "#fcf0f6" }
perm_sep = { fg = "#d683af" }

[mode]
normal_main = { fg = "#191724", bg = "darkgray", bold = true }
normal_alt = { fg = "#6F6A87", bg = "#2A273F" }
select_main = { fg = "#191724", bg = "#b4637a", bold = true }
select_alt = { fg = "#6F6A87", bg = "#2A273F" }
unset_main = { fg = "#e0def4", bg = "#31748f", bold = true }
unset_alt = { fg = "#6F6A87", bg = "#2A273F" }

