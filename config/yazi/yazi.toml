[mgr]
ratio			= [ 1, 4, 3 ]
# sort_by			= "alphabetical"
# sort_reverse	= true
# sort_dir_first	= true

[preview]
image_quality = 50

[opener]
edit = [
	{ run = 'nvim "$@"', block = true },
]
video = [
	{ run = 'mpv "$@"', orphan = true, for = "unix" },
]
book = [
	# open zathura into a Hyprland group, only works when there is a group window at the top  
	{ run = 'zathura "$@" && hyprclt dispatch moveintogroup u', orphan = true },
]
image = [
	{ run = 'nsxiv "$@"', orphan = true },
]
audio = [
	{ run = 'mpv --audio-display=no "$@"' },
]
do-nothing = [
	{ run = ':' },
]
fallback-open = [
	{ run = 'xdg-open "$@"' },
]

[open]
prepend_rules = [
	{ mime = "text/*",					use = "edit" },
	{ mime = "application/json",		use = "edit" },
	{ mime = "application/json",		use = "edit" },
	{ mime = "application/javascript",	use = "edit" },

	{ mime = "application/pdf",			use = "book" },
	{ mime = "image/vnd.djvu",			use = "book" },
	{ mime = "image/*",					use = "image" },
	{ mime = "application/epub*",		use = "book" },

	{ mime = "video/*",					use = "video" },

	{ mime = "audio/*",					use = "audio" },
	{ name = "*.html",					use = [ "open", "edit" ] },
]
append_rules = [
	{ name = "*",						use = "fallback-open" },
]

[plugin]
prepend_previewers = [
	{ name = "*.srt", run = "code" },
	{ mime = "application/*zip,tar,bzip2,7z-compressed,rar,xz}", run = "ouch" },
	# { mime = "application/tar",           run = "ouch" },
	# { mime = "application/bzip2",         run = "ouch" },
	# { mime = "application/7z-compressed", run = "ouch" },
	# { mime = "application/rar",           run = "ouch" },
	# { mime = "application/xz",            run = "ouch" },
]
