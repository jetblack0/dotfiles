# Noctalia
# ---------------------------------------------
# full reference: https://docs.noctalia.dev (`noctalia msg --help`)
# Only what differs from the defaults (`noctalia config export full`)
# ---------------------------------------------


# Bar
# ---------------------------------------------
[bar]
order = [ "main" ]

    [bar.main]
    background_opacity = 0.91999995708465576
    end = [
        "media",
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "battery-threshold",
        "hypr",
        "control-center",
        "session"
    ]
    margin_ends = 10
    radius = 10
    radius_bottom_left = 10
    radius_bottom_right = 10
    radius_top_left = 10
    radius_top_right = 10
    scale = 1.25
    start = [ "launcher", "workspaces" ]
    thickness = 32
    widget_spacing = 15


# Control center
# ---------------------------------------------
[control_center]

    [control_center.calendar]
    event_date_format = "%A %e %B"
    event_time_format = "%H:%M"


# Idle
# ---------------------------------------------
[idle]
behavior_order = [ "lock", "screen-off" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0


# Keybinds
# ---------------------------------------------
[keybinds]
down = [ "Down", "Alt+j" ]
left = [ "Left", "Alt+h" ]
right = [ "Right", "Alt+l" ]
up = [ "Up", "Alt+k" ]


# Lock screen
# ---------------------------------------------
[lockscreen]
blur_intensity = 0.099999994039535522


# Lock screen widgets
# ---------------------------------------------
# what is drawn on the lock screen, and where. cx/cy are widget
# CENTRES in the placement_width x placement_height space.
[lockscreen_widgets]
enabled = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 160.0
    box_width = 560.0
    cx = 800.0
    cy = 196.0
    enabled = true
    output = ""
    placement_height = 1000.0
    placement_width = 1600.0
    rotation = -0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        center_text = true
        clock_style = "digital"
        color = "on_surface"
        font_family = "SF Pro Display Clock"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 32.0
    box_width = 400.0
    cx = 800.0
    cy = 276.0
    enabled = true
    output = ""
    placement_height = 1000.0
    placement_width = 1600.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        center_text = true
        color = "on_surface_variant"
        font_family = "SF Pro Display"
        format = "{:%A, %B %d}"
        shadow = true

[plugins]
enabled = [ "damian-ds7/battery-threshold", "jetblack0/hypr" ]


# Shell
# ---------------------------------------------
[shell]
font_family = "CodeNewRoman Nerd Font"
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true
    privilege_command = "pkexec"

    [shell.launcher]

        [shell.launcher.dmenu]

            [shell.launcher.dmenu.entry.nf]
            command = "cat $HOME/.local/share/nerd-glyphs/glyphs.tsv"
            exec = "printf '%s\\n' \"{selection}\" | cut -f1 | tr -d '\\n' | wl-copy"
            glyph = "typography"
            prefix = "nf"

            [shell.launcher.dmenu.entry.pass]
            command = "find ${PASSWORD_STORE_DIR:-$HOME/.password-store} -name '*.gpg' -printf '%P\\n' | sed 's/\\.gpg$//' | sort"
            exec = "pass show -c \"{selection}\""
            glyph = "key"
            prefix = "pass"

    [shell.window_switcher]
    mru = true


# Theme
# ---------------------------------------------
# builtin Rosé Pine, to match hypr conf/themes/rose-pine.lua.
[theme]
builtin = "Rosé Pine"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme", "qt" ]
    community_ids = [ "zen-browser" ]

[widget.battery-threshold]
type = "damian-ds7/battery-threshold:battery-threshold"

[widget.control-center]
glyph = "adjustments-horizontal"
type = "control-center"

[widget.hypr]
type = "jetblack0/hypr:indicator"

[widget.media]
hide_when_no_media = true

[widget.workspaces]
scale = 1.25
style = "focus_hint"
type = "workspaces"
