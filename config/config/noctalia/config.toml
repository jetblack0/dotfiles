# Noctalia
# ---------------------------------------------
# full reference: https://docs.noctalia.dev (`noctalia msg --help`)
# ---------------------------------------------


# Accessibility
# ---------------------------------------------
[accessibility]
high_contrast = false
ui_scale = 1.0


# Audio feedback
# ---------------------------------------------
[audio]
enable_overdrive = false
enable_sounds = false
notification_sound = ""
sound_volume = 0.5
volume_change_sound = ""


# Backdrop
# ---------------------------------------------
[backdrop]
blur_intensity = 0.5
enabled = false
tint_intensity = 0.30000001192092896


# Bar
# ---------------------------------------------
[bar]
order = [ "main" ]

    [bar.main]
    auto_hide = false
    background_opacity = 0.91999995708465576
    border = "outline"
    border_width = 0.0
    capsule = false
    capsule_fill = "surface_variant"
    capsule_group = []
    capsule_opacity = 1.0
    capsule_padding = 6.0
    capsule_thickness = 0.75999999046325684
    center = [ "clock" ]
    concave_edge_corners = true
    contact_shadow = false
    enabled = true
    end = [
        "media",
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "trackpad",
        "control-center",
        "session"
    ]
    font_scale = 1.0
    font_weight = 500
    hover_highlight = true
    layer = "top"
    margin_edge = 0
    margin_ends = 10
    margin_opposite_edge = 0
    padding = 14
    panel_overlap = 1
    position = "top"
    radius = 10
    radius_bottom_left = 10
    radius_bottom_right = 10
    radius_top_left = 10
    radius_top_right = 10
    reserve_space = true
    scale = 1.25
    shadow = true
    show_on_workspace_switch = true
    smart_auto_hide = false
    start = [ "launcher", "workspaces" ]
    thickness = 32
    widget_spacing = 15

        [bar.main.dead_zone]


# Battery
# ---------------------------------------------
[battery]
warning_threshold = 10


# Brightness
# ---------------------------------------------
[brightness]
enable_ddcutil = false
ignore_mmids = []
minimum_brightness = 0.0
sync_all_monitors = false


# Calendar
# ---------------------------------------------
[calendar]
enabled = false
refresh_minutes = 15


# Control center
# ---------------------------------------------
[control_center]
hidden_tabs = []
show_session_button = true
show_shortcut_labels = true
sidebar = "compact"
sidebar_section = "compact"
width = 700

    [control_center.calendar]
    event_date_format = "%A %e %B"
    event_time_format = "%H:%M"
    show_events_card = true
    show_week_numbers = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"


# Desktop widgets
# ---------------------------------------------
[desktop_widgets]
enabled = true
schema_version = 2

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true


# Dock
# ---------------------------------------------
[dock]
active_monitor_only = false
active_opacity = 1.0
active_scale = 1.0
auto_hide = false
background_opacity = 0.87999999523162842
border = "outline"
border_width = 0.0
concave_edge_corners = true
cross_axis_padding = 8
enabled = false
icon_size = 48
inactive_opacity = 0.85000002384185791
inactive_scale = 0.85000002384185791
item_spacing = 6
launcher_custom_image = ""
launcher_custom_image_colorize = false
launcher_icon = "grid-dots"
launcher_position = "none"
layer = "top"
magnification = true
magnification_scale = 1.4500000476837158
main_axis_padding = 16
margin_edge = 0
margin_ends = 0
monitors = []
pinned = []
position = "bottom"
radius = 16
radius_bottom_left = 16
radius_bottom_right = 16
radius_top_left = 16
radius_top_right = 16
reserve_space = true
shadow = true
show_dots = false
show_instance_count = true
show_running = true
smart_auto_hide = false


# Hooks
# ---------------------------------------------
[hooks]
battery_charging = []
battery_discharging = []
battery_percentage_changed = []
battery_plugged = []
bluetooth_disabled = []
bluetooth_enabled = []
colors_changed = []
logging_out = []
power_profile_changed = []
rebooting = []
session_locked = []
session_unlocked = []
shutting_down = []
started = []
theme_mode_changed = []
wallpaper_changed = []
wifi_disabled = []
wifi_enabled = []


# Hot corners
# ---------------------------------------------
[hot_corners]
delay_ms = 0
enabled = false

    [hot_corners.bottom_left]
    action = "none"
    command = ""

    [hot_corners.bottom_right]
    action = "none"
    command = ""

    [hot_corners.top_left]
    action = "none"
    command = ""

    [hot_corners.top_right]
    action = "none"
    command = ""


# Idle
# ---------------------------------------------
[idle]
behavior_order = [ "lock", "screen-off" ]
pre_action_fade_seconds = 2.0

    [idle.behavior.lock]
    action = "lock"
    command = ""
    enabled = true
    locked_timeout = 0.0
    resume_command = ""
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    command = ""
    enabled = true
    locked_timeout = 0.0
    resume_command = ""
    timeout = 660.0


# Keybinds
# ---------------------------------------------
[keybinds]
cancel = [ "Escape" ]
copy = [ "Ctrl+c" ]
delete = [ "Delete" ]
down = [ "Down", "Alt+j" ]
left = [ "Left", "Alt+h" ]
right = [ "Right", "Alt+l" ]
save = [ "Ctrl+s" ]
tab_next = [ "Tab" ]
tab_previous = [ "Shift+ISO_Left_Tab" ]
up = [ "Up", "Alt+k" ]
validate = [ "Return", "KP_Enter", "space" ]


# Location
# ---------------------------------------------
[location]
address = ""
auto_locate = false
custom_schedule = false
sunrise = ""
sunset = ""


# Lock screen
# ---------------------------------------------
[lockscreen]
allow_empty_password = false
blur_intensity = 0.099999994039535522
blurred_desktop = false
enabled = true
fingerprint = true
lock_before_suspend = true
monitors = []
tint_intensity = 0.30000001192092896
wallpaper = ""


# Lock screen widgets
# ---------------------------------------------
# what is drawn on the lock screen, and where. cx/cy are widget
# CENTRES in the placement_width x placement_height space.
[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1", "lockscreen-widget-0000000000000001", "lockscreen-widget-0000000000000002" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 70.0
    box_width = 240.0
    cx = 800.0
    cy = 913.0
    enabled = true
    output = "Virtual-1"
    placement_height = 1000.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.0
        background_radius = 12.0
        center_password_text = false
        input_opacity = 0.59999999999999998
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = false
        show_media = true
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 160.0
    box_width = 560.0
    cx = 800.0
    cy = 196.0
    enabled = true
    output = ""
    placement_height = 1000.0
    placement_width = 1600.0
    rotation = -0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        center_text = true
        clock_style = "digital"
        color = "on_surface"
        font_family = "Inter Display Thin"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 32.0
    box_width = 400.0
    cx = 800.0
    cy = 276.0
    enabled = true
    output = ""
    placement_height = 1000.0
    placement_width = 1600.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        center_text = true
        color = "on_surface_variant"
        font_family = "Inter"
        format = "{:%A, %B %d}"
        shadow = true


# Night light
# ---------------------------------------------
[nightlight]
enabled = false
force = false
temperature_day = 6500
temperature_night = 4000


# Notifications
# ---------------------------------------------
[notification]
background_opacity = 0.97000002861022949
border = true
collapse_on_dismiss = true
enable_daemon = true
history_retention_hours = 0
layer = "top"
max_visible = 0
monitors = []
offset_x = 20
offset_y = 8
position = "top_right"
scale = 1.0
show_actions = true
show_app_name = true


# OSD
# ---------------------------------------------
[osd]
background_opacity = 0.97000002861022949
border = true
enabled = true
monitors = []
offset_x = 20
offset_y = 8
orientation = "horizontal"
position = "top_center"
position_vertical = "top_center"
scale = 1.0

    [osd.kinds]
    bluetooth = true
    brightness = true
    caffeine = true
    dnd = true
    keyboard_backlight = true
    keyboard_layout = true
    lock_keys = true
    media = true
    nightlight = true
    power_profile = true
    privacy = true
    volume = true
    volume_input = true
    volume_output = true
    wifi = true


# Plugins
# ---------------------------------------------
[plugin_settings]

[plugins]
auto_update = "all"
enabled = [ "jetblack0/trackpad" ]

    [[plugins.source]]
    enabled = true
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    enabled = true
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"


# Shell
# ---------------------------------------------
[shell]
app_icon_colorize = false
avatar_path = ""
button_borders = true
card_borders = true
clipboard_auto_paste = "auto"
clipboard_confirm_clear_history = true
clipboard_enabled = true
clipboard_history_max_entries = 100
clipboard_image_action_command = ""
clipboard_keep_from_closed_apps = true
corner_radius_scale = 1.0
date_format = "%A, %x"
disable_mipmaps = false
external_ip_enabled = false
font_family = "CodeNewRoman Nerd Font"
input_borders = true
launch_apps_as_systemd_services = false
launch_apps_custom_command = ""
niri_overview_type_to_launch_enabled = false
offline_mode = false
password_style = "default"
polkit_agent = true
popup_borders = true
popup_shadows = true
screen_time_enabled = false
settings_show_advanced = true
settings_window_translucent = false
setup_wizard_enabled = true
shared_gl_context = true
show_location = true
telemetry_enabled = false
time_format = "{:%H:%M}"

    [shell.animation]
    enabled = true
    speed = 1.0

    [shell.greeter_sync]
    auto_sync = false

    [shell.keyboard_layout]

    [shell.launcher]
    app_grid = false
    auto_paste = "auto"
    categories = true
    compact = false
    fetch_exchange_rates = true
    pinned = []
    provider_prefix = "/"
    show_app_actions = false
    show_app_origin_indicator = true
    show_icons = true
    sort_by_usage = true

        [shell.launcher.dmenu]

            [shell.launcher.dmenu.entry.pass]
            command = "find ${PASSWORD_STORE_DIR:-$HOME/.password-store} -name '*.gpg' -printf '%P\\n' | sed 's/\\.gpg$//' | sort"
            exec = "pass show -c \"{selection}\""
            glyph = "key"
            prefix = "pass"

    [shell.mpris]
    blacklist = []

    [shell.panel]
    borders = true
    clipboard_placement = "floating"
    clipboard_position = "center"
    control_center_placement = "attached"
    control_center_position = "auto"
    floating_layer = "overlay"
    floating_offset = 8
    launcher_placement = "floating"
    launcher_position = "center"
    list_item_background = false
    open_near_click_clipboard = false
    open_near_click_control_center = false
    open_near_click_launcher = false
    open_near_click_session = false
    open_near_click_wallpaper = false
    polkit_placement = "floating"
    polkit_position = "center"
    session_placement = "attached"
    session_position = "auto"
    shadow = true
    transparency_mode = "solid"
    wallpaper_placement = "attached"
    wallpaper_position = "auto"

    [shell.privacy]
    cam_filter_regex = ""
    mic_filter_regex = ""
    screen_filter_regex = ""

    [shell.screen_corners]
    enabled = false
    size = 32

    [shell.screenshot]
    confirm_region = false
    copy_to_clipboard = true
    directory = ""
    filename_pattern = ""
    freeze_screen = true
    pipe_command = ""
    pipe_to_command = false
    remember_last_region = false
    save_to_file = true
    show_cursor = false

    [shell.session]
    grid = false
    grid_columns = 3
    show_shortcuts = true

        [shell.session.power]

        [[shell.session.actions]]
        action = "lock"
        command = ""
        countdown_seconds = 0.0
        enabled = true
        glyph = ""
        label = ""
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        command = ""
        countdown_seconds = 0.0
        enabled = true
        glyph = ""
        label = ""
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        command = ""
        countdown_seconds = 0.0
        enabled = true
        glyph = ""
        label = ""
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        command = ""
        countdown_seconds = 0.0
        enabled = true
        glyph = ""
        label = ""
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        command = ""
        countdown_seconds = 0.0
        enabled = true
        glyph = ""
        label = ""
        shortcut = "5"
        variant = "destructive"

    [shell.shadow]
    alpha = 0.55000001192092896
    direction = "down"

    [shell.window_switcher]
    mru = true


# Storage
# ---------------------------------------------
[storage]
key_file = ""
key_source = "secret-service"


# System monitor
# ---------------------------------------------
[system.monitor]
cpu_freq_activity_threshold = 2.5
cpu_freq_critical_threshold = 4.5
cpu_poll_seconds = 2.0
cpu_temp_activity_threshold = 60.0
cpu_temp_critical_threshold = 85.0
cpu_temp_sensor_path = ""
cpu_usage_activity_threshold = 50.0
cpu_usage_critical_threshold = 90.0
disk_free_activity_threshold = 80.0
disk_free_critical_threshold = 95.0
disk_free_pct_activity_threshold = 80.0
disk_free_pct_critical_threshold = 95.0
disk_poll_seconds = 10.0
disk_used_activity_threshold = 80.0
disk_used_critical_threshold = 95.0
disk_used_pct_activity_threshold = 80.0
disk_used_pct_critical_threshold = 95.0
enabled = true
gpu_poll_seconds = 5.0
gpu_temp_activity_threshold = 60.0
gpu_temp_critical_threshold = 85.0
gpu_usage_activity_threshold = 50.0
gpu_usage_critical_threshold = 95.0
gpu_vram_activity_threshold = 50.0
gpu_vram_critical_threshold = 90.0
memory_poll_seconds = 2.0
net_rx_activity_threshold = 1.0
net_rx_critical_threshold = 50.0
net_tx_activity_threshold = 1.0
net_tx_critical_threshold = 50.0
network_poll_seconds = 3.0
ram_pct_activity_threshold = 60.0
ram_pct_critical_threshold = 90.0
swap_pct_activity_threshold = 20.0
swap_pct_critical_threshold = 80.0


# Theme
# ---------------------------------------------
# builtin Rosé Pine, to match hypr conf/themes/rose-pine.lua.
[theme]
builtin = "Rosé Pine"
community_palette = "Oxocarbon"
custom_palette = ""
mode = "dark"
pure_black_dark = false
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme", "qt" ]
    community_ids = [ "zen-browser" ]
    enable_builtin_templates = true
    enable_community_templates = true


# Wallpaper
# ---------------------------------------------
[wallpaper]
directory = ""
directory_dark = ""
directory_light = ""
edge_smoothness = 0.30000001192092896
enabled = true
fill_color = ""
fill_mode = "crop"
per_monitor_directories = false
transition = [ "fade", "wipe", "disc", "stripes", "zoom", "honeycomb" ]
transition_duration = 1500.0
transition_on_startup = false

    [wallpaper.automation]
    enabled = false
    interval_seconds = 1800
    order = "random"
    recursive = true


# Weather
# ---------------------------------------------
[weather]
effects = true
enabled = true
refresh_minutes = 30
unit = "metric"


# Bar widgets
# ---------------------------------------------
[widget.active_window]
icon_size = 14.0
max_length = 260.0
min_length = 80.0
title_scroll = "none"
type = "active_window"

[widget.control-center]
glyph = "adjustments-horizontal"
type = "control-center"

[widget.cpu]
stat = "cpu_usage"
type = "sysmon"

[widget.date]
format = "{:%a %d %b}"
type = "clock"

[widget.input_volume]
device = "input"
type = "volume"

[widget.keyboard_layout]
hide_when_single_layout = false
type = "keyboard_layout"

[widget.lock_keys]
display = "short"
hide_when_off = false
show_caps_lock = true
show_num_lock = true
show_scroll_lock = false
type = "lock_keys"

[widget.media]
art_size = 16.0
hide_when_no_media = true
max_length = 220.0
min_length = 80.0
title_scroll = "none"
type = "media"

[widget.network_rx]
stat = "net_rx"
type = "sysmon"

[widget.network_tx]
stat = "net_tx"
type = "sysmon"

[widget.output_volume]
device = "output"
type = "volume"

[widget.ram]
stat = "ram_used"
type = "sysmon"

[widget.spacer]
interactive = false
type = "spacer"

[widget.temp]
stat = "cpu_temp"
type = "sysmon"

[widget.trackpad]
type = "jetblack0/trackpad:indicator"

[widget.workspaces]
scale = 1.25
style = "focus_hint"
type = "workspaces"
