# Fcitx5 theme (noctalia user template)
# ---------------------------------------------
# A copy of noctalia's community "fcitx5" template, with our changes:
# no borders, rounded corners and highlight (background.svg,
# highlight.svg), and tighter text margins.
# Rendered to ~/.local/share/fcitx5/themes/noctalia/ on every re-theme.

[Metadata]
Name=noctalia
Version=1.0
Author=Noctalia Community
Description=Noctalia Material You theme for Fcitx5
ScaleWithDPI=True

[InputPanel]
NormalColor={{colors.on_surface.default.hex}}
HighlightColor={{colors.on_primary.default.hex}}
HighlightBackgroundColor={{colors.primary.default.hex}}
HighlightCandidateColor={{colors.on_primary.default.hex}}
FullWidthHighlight=True
PageButtonAlignment=Last Candidate

[InputPanel/Background]
Image=background.svg
Color={{colors.surface_container_high.default.hex}}
BorderColor={{colors.primary.default.hex}}
BorderWidth=0

[InputPanel/Background/Margin]
Left=8
Right=8
Top=8
Bottom=8

[InputPanel/Highlight]
Image=highlight.svg
Color={{colors.primary.default.hex}}

[InputPanel/Highlight/Margin]
Left=6
Right=6
Top=4
Bottom=4

[InputPanel/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/TextMargin]
Left=8
Right=8
Top=5
Bottom=5

[Menu]
NormalColor={{colors.on_surface.default.hex}}
HighlightColor={{colors.on_primary.default.hex}}
HighlightCandidateColor={{colors.on_primary.default.hex}}
Spacing=4

[Menu/Background]
Color={{colors.surface_container_high.default.hex}}
BorderColor={{colors.primary.default.hex}}
BorderWidth=0

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Color={{colors.primary.default.hex}}

[Menu/Highlight/Margin]
Left=8
Right=8
Top=4
Bottom=4

[Menu/Separator]
Color={{colors.outline_variant.default.hex}}

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/TextMargin]
Left=8
Right=8
Top=4
Bottom=4
