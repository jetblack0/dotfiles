# GTK 3
# ---------------------------------------------

[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Tela-circle-black-dark
gtk-cursor-theme-name=capitaine-cursors
gtk-cursor-theme-size=24
# Ctrl+E and Ctrl+W in text fields, for xwayland apps; wayland apps get it
# from gsettings (autostart.lua)
gtk-key-theme-name=emacs-lite
# fcitx5 for gtk apps under xwayland; wayland gtk apps ignore this
gtk-im-module=fcitx
