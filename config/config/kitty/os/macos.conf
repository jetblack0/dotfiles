# macOS
# ---------------------------------------------
# Option reaches the shell and nvim as Alt.
macos_option_as_alt yes

# Defaults that collide with the bindings below.
map alt+cmd+k no_op
map alt+cmd+h no_op
map cmd+, no_op

map cmd+enter new_os_window
map cmd+t new_tab
map cmd+w close_tab

map cmd+shift+h prev_tab
map cmd+shift+l next_tab

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7

# Rename the focused tab.
map cmd+shift+r set_tab_title
map cmd+shift+alt+r set_tab_title ""
# ---------------------------------------------
