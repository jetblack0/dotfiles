# Appearance
# ---------------------------------------------
background_opacity 0.92
dynamic_background_opacity yes
window_padding_width 5 15
hide_window_decorations yes
tab_bar_edge top

# Colour scheme
# include themes/papercolor/light.conf
# include themes/rosepine/rosepine.conf
include themes/gruvbox/gruvboxdark.conf
# ---------------------------------------------


# Font
# ---------------------------------------------
font_family      UDEV Gothic NFLG
# font_family      Osaka
font_size 18.0

# Ligatures stay on everywhere except the cell under the cursor.
disable_ligatures cursor

# Nerd Fonts v3.3.0 ranges -> the patched font.
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0,U+25ef JetBrainsMono Nerd Font Mono
symbol_map U+4e00-U+9fff Noto Sans Mono CJK SC
# ---------------------------------------------


# Cursor
# ---------------------------------------------
shell_integration no-cursor
cursor_shape block
cursor_blink_interval 0
# ---------------------------------------------


# Behaviour
# ---------------------------------------------
# startup_session startup.session
auto_reload_config -1
scrollback_lines 5000
enable_audio_bell no
paste_actions no-op
clipboard_control write-primary write-clipboard no-append
allow_remote_control yes
# ---------------------------------------------


# Tabs
# ---------------------------------------------
# tab_title_template {bell_symbol}{activity_symbol}{index}: {title}
# ---------------------------------------------


# Keys -- disabled defaults
# ---------------------------------------------
map ctrl+shift+u no_op
# ---------------------------------------------


# Keys -- font and opacity
# ---------------------------------------------
map ctrl+equal change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+shift+equal change_font_size all 0

map ctrl+shift+up set_background_opacity -0.1
map ctrl+shift+down set_background_opacity +0.1
map ctrl+shift+right set_background_opacity default
# ---------------------------------------------


# Keys -- passthrough
# ---------------------------------------------
# shift+enter as a distinct key, picked up by the tmux bind of the same name.
map shift+enter send_text all \x1b[13;2u
# ---------------------------------------------


# Scrollback pager
# ---------------------------------------------
# scrollback_pager nvim --noplugin -u ~/.config/kitty/scrollback-pager/nvim/init.vim -c "silent write! /tmp/kitty_scrollback_buffer | te cat /tmp/kitty_scrollback_buffer - " -c "silent $"
# ---------------------------------------------


# Platform
# ---------------------------------------------
globinclude os/${KITTY_OS}.conf
# ---------------------------------------------
