# Input method (fcitx5)
# ---------------------------------------------
# Set here, not in hypr's env.lua, so every app in the session sees them.
# GTK_IM_MODULE stays unset on purpose. Wayland gtk apps then use the
# compositor's input method protocol, and setting it breaks pinentry.

# x11 apps under xwayland
XMODIFIERS=@im=fcitx
# qt5, and qt6 apps that skip QT_IM_MODULES
QT_IM_MODULE=fcitx
# qt 6.7+: try the wayland protocol first, then the fcitx plugin
QT_IM_MODULES=wayland;fcitx;ibus
# sdl2 games
SDL_IM_MODULE=fcitx
