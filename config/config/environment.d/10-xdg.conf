# Session environment for systemd-managed logins
# ---------------------------------------------
# On NixOS uwsm loads the login profile (/etc/set-environment) after this
# file, so any variable it also exports gets NixOS's value: XDG_DATA_DIRS
# here is ignored there (nix/modules/winebox.nix adds it), the rest stand.
XDG_CONFIG_HOME=${HOME}/.config
XDG_CACHE_HOME=${HOME}/.cache
XDG_DATA_HOME=${HOME}/.local/share
XDG_STATE_HOME=${HOME}/.local/state

# launchers for the winebox/tuxbox apps live with their boxes on the data
# drive, in ~/assets/state/applications; harmless when it isn't mounted
XDG_DATA_DIRS=${HOME}/assets/state:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}

GNUPGHOME=${XDG_DATA_HOME}/gnupg
PASSWORD_STORE_DIR=${XDG_DATA_HOME}/pass
