<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Libertinus Serif</family>
      <family>Noto Serif CJK SC</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans CJK SC</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>emoji</family>
    <prefer>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <match target="pattern">
    <test name="family"><string>SF Pro Display Clock</string></test>
    <edit name="family" mode="assign" binding="strong"><string>SF Pro Display</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>semibold</const></edit>
  </match>

</fontconfig>
