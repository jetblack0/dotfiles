# File list
# ---------------------------------------------
[mgr]
cwd = { fg = "magenta", bold = true }


# Mode indicator
# ---------------------------------------------
[mode]
normal_main = { fg = "#191724", bg = "darkgray", bold = true }
normal_alt  = { fg = "#6F6A87", bg = "#2A273F" }
select_main = { fg = "#191724", bg = "#b4637a", bold = true }
select_alt  = { fg = "#6F6A87", bg = "#2A273F" }
unset_main  = { fg = "#e0def4", bg = "#31748f", bold = true }
unset_alt   = { fg = "#6F6A87", bg = "#2A273F" }
# ---------------------------------------------


# Status bar
# ---------------------------------------------
[status]
# Permissions, as shown on the right-hand side.
perm_type  = { fg = "#fcf0f6" }
perm_read  = { fg = "#fcf0f6" }
perm_write = { fg = "#fcf0f6" }
perm_exec  = { fg = "#fcf0f6" }
perm_sep   = { fg = "#d683af" }

# Progress bar for running file operations.
progress_label  = { fg = "#e0def4", bold = true }
progress_normal = { fg = "#191724", bg = "#2A273F" }
progress_error  = { fg = "#B4637A", bg = "#2A273F" }
# ---------------------------------------------


# File colours
# ---------------------------------------------
# First match wins, so the specific globs go above the wildcards.
[filetype]
rules = [
	# Directories, links and special files
	{ url  = "*/", fg = "blue", bold = true },
	{ mime = "*", is = "orphan", fg = "red", bg = "black", bold = true },
	{ mime = "*", is = "block", fg = "yellow", bg = "black", bold = true },
	{ mime = "*", is = "char", fg = "yellow", bg = "black", bold = true },
	{ mime = "*", is = "exec", fg = "green", bold = true },
	{ mime = "*", is = "fifo", fg = "yellow", bg = "black" },
	{ mime = "*", is = "link", fg = "cyan", bold = true },
	{ mime = "*", is = "sock", fg = "magenta", bold = true },
	{ mime = "*", is = "sticky", fg = "white", bg = "red" },

	# Archives
	{ mime = "application/zip", fg = "lightred", bold = true },
	{ mime = "application/gzip", fg = "lightred", bold = true },
