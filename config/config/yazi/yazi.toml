# File list
# ---------------------------------------------
[mgr]
ratio          = [ 1, 4, 3 ]           # parent : current : preview
sort_by        = "mtime"
sort_reverse   = true                  # newest first
sort_dir_first = true
# ---------------------------------------------


# Preview
# ---------------------------------------------
[preview]
image_quality = 70                     # 50-90, lower is faster to decode
# ---------------------------------------------


# Openers
# ---------------------------------------------
[opener]
edit = [
	{ run = 'nvim %s', block = true, for = "unix" },
]
image = [
	{ run = 'nsxiv %s', orphan = true, for = "linux" },
	{ run = 'open %s',  orphan = true, for = "macos" },
]
video = [
	{ run = 'mpv %s', orphan = true, for = "unix" },
]
audio = [
	{ run = 'mpv --audio-display=no %s', for = "unix" },
]
book = [
	{ run = 'zathura %s', orphan = true, for = "unix" },
]
# Hand anything unrecognised to the desktop.
fallback-open = [
	{ run = 'xdg-open %s', for = "linux" },
	{ run = 'open %s',     for = "macos" },
]
# ---------------------------------------------


# Open rules
# ---------------------------------------------
# First match wins, so specific mimes must stay above the wildcards.
[open]
prepend_rules = [
	{ mime = "text/*",                 use = "edit" },
	{ mime = "application/json",       use = "edit" },
	{ mime = "application/javascript", use = "edit" },

	{ mime = "application/pdf",   use = "book" },
	{ mime = "application/epub*", use = "book" },
	{ mime = "image/vnd.djvu",    use = "book" },

	{ mime = "image/*", use = "image" },
	{ mime = "video/*", use = "video" },
	{ mime = "audio/*", use = "audio" },
]
append_rules = [
	{ url = "*", use = "fallback-open" },
]
# ---------------------------------------------


# Previewers
# ---------------------------------------------
[plugin]
# Archive contents as a tree. Needs `ouch` on PATH.
prepend_previewers = [
	{ mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch" },
]
# ---------------------------------------------
