# Trackpad indicator
# ---------------------------------------------
# Shows whether the touchpad is on, and toggles it on click. The state and
# the toggle both belong to hypr/scripts/trackpad-toggle.sh, the plugin only
# renders $XDG_STATE_HOME/hypr/trackpad.

id = "jetblack0/trackpad"
name = "Trackpad"
version = "1.0.0"
plugin_api = 23
description = "Touchpad on/off indicator driven by trackpad-toggle.sh"

# Referenced from the bar as type = "jetblack0/trackpad:indicator".
[[widget]]
id = "indicator"
entry = "widget.luau"

    [widget.actions]
    left = "exec $HOME/.config/hypr/scripts/trackpad-toggle.sh"
