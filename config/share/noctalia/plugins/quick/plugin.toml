# Quick settings
# ---------------------------------------------
# A dropdown from the bar with the switches used most often.

id = "jetblack0/quick"
name = "Quick settings"
version = "1.0.0"
plugin_api = 23
description = "Dropdown of the most used switches: server mode, caffeine, hypr toggles, do not disturb, screen recording, hdmi audio"
icon = "toggle-left"

[[widget]]
id = "indicator"
entry = "widget.luau"

    [widget.actions]
    left = "panel-toggle jetblack0/quick:menu"

[[panel]]
id = "menu"
entry = "panel.luau"
width = 300
height = 345
placement = "attached"
open_near_click = true
# Take the keyboard as soon as the panel opens, so Alt+N (binds.lua) can be
# followed by Tab / Shift+Tab to move between buttons and Enter to press one.
# The default ("on_demand") only takes it on a click.
keyboard_focus = "exclusive"
