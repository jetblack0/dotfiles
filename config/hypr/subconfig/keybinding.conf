$mainMod = SUPER
$browser = zen-browser
$rofi-theme = gruvbox

# System ###########################################################
bindp = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindp = , XF86AudioLowerVolume, exec, pamixer -d 5
bindp = , XF86AudioMute, exec, pamixer -t
bindp = , XF86MonBrightnessDown, exec, sudo brightness -3
bindp = , XF86MonBrightnessUp, exec, sudo brightness +3
bindp = $mainMod, 112, exec, hyprctl hyprsunset gamma +10
bindp = $mainMod, 117, exec, hyprctl hyprsunset gamma -10
bindp = $mainMod SHIFT, 112, exec, hyprctl hyprsunset temperature +1000
bindp = $mainMod SHIFT, 117, exec, hyprctl hyprsunset temperature -1000
bind = $mainMod, End, exec, pamixer -i 5
bind = $mainMod, Delete, exec, pamixer -d 5
bind = $mainMod, Home, exec, pamixer -t


# Hyprland ###########################################################
bindp = $mainMod, q, killactive, 
bind = $mainMod CTRL_R, q, exec, systemctl --user stop graphical-session.target && hyprctl dispatch exit
bind = $mainMod CTRL_R, r, exec, dunstify -I "$HOME/.config/dunst/images/icons/reloading.svg" "hyprland reload status" "$(hyprctl reload)"
# NOTE: toggle error messages. It doesn't work for some reasons, enve through the value is changed 
# bind = $mainMod CTRL_R, d, exec, hyprctl keyword debug:suppress_errors $((1 - $(hyprctl -j getoption debug:suppress_errors | jq '.int')))
bind = $mainMod CTRL_R, u, exec, hyprpm update


# Program and scripts ###########################################################
# NOTE: i don't use mpc by now
# bind = , XF86AudioNext, exec, mpc next
# bind = , XF86AudioPrev, exec, mpc prev
# bind = , XF86AudioPlay, exec, mpc toggle
# bind = , XF86AudioStop, exec, kill $(pidof mpd)
# bind = , XF86Tools, exec, systemctl --user start mpd; mpc update 

# screenshot utilities
bindp = , 107, exec, grimblast --freeze --notify copysave screen "$(cat $HOME/.config/hypr/subconfig/paths/grimblast-path)/$(date '+%Y-%m-%d_%H-%M-%S.png')"
bindp = $mainMod, s, exec, grimblast --freeze --notify copysave area "$(cat $HOME/.config/hypr/subconfig/paths/grimblast-path)/$(date '+%Y-%m-%d_%H-%M-%S.png')"
bindp = $mainMod SHIFT, s, exec, grimblast --freeze --notify copy area
bindp = $mainMod SHIFT, a, exec, grimblast --freeze --notify edit area

# rofi utilities
bindp = $mainMod, r, exec, $HOME/.config/rofi/launcher.sh $rofi-theme "CodeNewRoman Nerd Font" 15
bindp = $mainMod, 49, exec, $HOME/.config/rofi/powermenu.sh $rofi-theme
bindp = $mainMod, 34, exec, $HOME/.config/rofi/pass.sh $rofi-theme "CodeNewRoman Nerd Font" 14
bindp = $mainMod, 35, exec, $HOME/.config/rofi/dmenu-toolbox.sh $rofi-theme "CodeNewRoman Nerd Font" 15

# notification utilities
bindp = $mainMod SHIFT, b, exec, $HOME/Development/script/gui/battery-check.sh
bindp = $mainMod, c, exec, dunstctl close
bindp = $mainMod SHIFT, c, exec, dunstctl history-pop

# wallpaper utilities
# bind = $mainMod, b, exec, systemctl --user start eww-toggle@status_bar_"$(hyprctl -j monitors | jaq -r '.[] | select(.focused == true) | .id')"
bind = $mainMod, b, exec, pkill -SIGUSR1 waybar 
bind = $mainMod, 20, exec, $HOME/Development/script/gui/swww/utility.sh random
bind = $mainMod, 21, exec, $HOME/Development/script/gui/swww/utility.sh favorite
# FIX: Doesn't work if multiple monitors are connected
# Delete current wallpaper from file.
bind = $mainMod SHIFT, 20, exec, rm $(swww query | grep -o 'image: .*$' | awk '{print $2}')
# Set current wallpaper as favorite.
bind = $mainMod SHIFT, 21, exec, cp $(swww query | grep -o 'image: .*$' | awk '{print $2}') ~/.config/hypr/subconfig/paths/favorite-wall
bind = $mainMod SHIFT, w, exec, find $HOME/Resources/media/pictures/wallpaper/landscape -regextype awk -iregex ".*png|.*jpeg|.*jpg|.*gif|.*webp" -print0 | xargs -0 eza -1 --color=never --reverse --sort=created | nsxiv -i

# others
bindp = $mainMod, p, exec, hyprpicker -a
# bind = $mainMod, escape, exec, swaylock
bind = $mainMod, escape, exec, loginctl lock-session

# programs shortcuts
bind = $mainMod, Return, exec, footclient
bind = $mainMod, 48, exec, $browser
bind = $mainMod CTRL, RETURN, exec, gns3-kitty
bind = $mainMod SHIFT, RETURN, exec, foot -T foot-float
# bind = $mainMod SHIFT, m, exec, systemctl --user start eww-toggle@music.service


# Layout ###########################################################
bindp = $mainMod, 61, togglefloating, 
bindp = $mainMod, space, exec, $HOME/Development/script/gui/hyprland/layout-switcher.sh

bindp = $mainMod, j, layoutmsg, cyclenext
bindp = $mainMod, k, layoutmsg, cycleprev
bindp = $mainMod, f, fullscreen
bindp = $mainMod, h, movefocus, l
bindp = $mainMod, l, movefocus, r
bindp = $mainMod, o, pin,
bindp = $mainMod SHIFT, j, layoutmsg, swapnext
bindp = $mainMod SHIFT, k, layoutmsg, swapprev

bindp = $mainMod SHIFT, e, togglegroup
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b


# Workspace and window ###########################################################
# Resize window (I don't like the way of resizing window)
bind= $mainMod,a,submap,resize

# will start a submap called "resize"
submap=resize
binde=,l,resizeactive,20 0
binde=,h,resizeactive,-20 0
binde=,k,resizeactive,0 20
binde=,j,resizeactive,0 -20
bind=,escape,submap,reset
submap=reset

# workspace -> split-workspace
bindp = $mainMod, 1, split-workspace, 1
bindp = $mainMod, 2, split-workspace, 2
bindp = $mainMod, 3, split-workspace, 3
bindp = $mainMod, 4, split-workspace, 4
bindp = $mainMod, 5, split-workspace, 5
bindp = $mainMod, 6, split-workspace, 6
bindp = $mainMod, 7, split-workspace, 7
bindp = $mainMod, 8, split-workspace, 8
bindp = $mainMod, 9, split-workspace, 9

bindp = $mainMod SHIFT, H, workspace, -1
bindp = $mainMod SHIFT, L, workspace, +1

bindp = $mainMod CTRL, h, movetoworkspace, -1
bindp = $mainMod CTRL, l, movetoworkspace, +1

bindp = $mainMod CTRL SHIFT, h, movetoworkspacesilent, -1
bindp = $mainMod CTRL SHIFT, l, movetoworkspacesilent, +1

# bind = $mainMod, TAB, exec, hyprctl dispatch workspace $(hyprctl -j monitors | jaq -r '.[] | select(.focused == true) | .activeWorkspace.id')

# movetoworkspace -> split-movetoworkspace
bindp = $mainMod SHIFT, 1, split-movetoworkspace, 1
bindp = $mainMod SHIFT, 2, split-movetoworkspace, 2
bindp = $mainMod SHIFT, 3, split-movetoworkspace, 3
bindp = $mainMod SHIFT, 4, split-movetoworkspace, 4
bindp = $mainMod SHIFT, 5, split-movetoworkspace, 5
bindp = $mainMod SHIFT, 6, split-movetoworkspace, 6
bindp = $mainMod SHIFT, 7, split-movetoworkspace, 7
bindp = $mainMod SHIFT, 8, split-movetoworkspace, 8
bindp = $mainMod SHIFT, 9, split-movetoworkspace, 9
bindp = $mainMod SHIFT, 0, split-movetoworkspace, 10

# movetoworkspacesilent -> split-movetoworkspacesilent
bindp = $mainMod SHIFT CTRL, 1, split-movetoworkspacesilent, 1
bindp = $mainMod SHIFT CTRL, 2, split-movetoworkspacesilent, 2
bindp = $mainMod SHIFT CTRL, 3, split-movetoworkspacesilent, 3
bindp = $mainMod SHIFT CTRL, 4, split-movetoworkspacesilent, 4
bindp = $mainMod SHIFT CTRL, 5, split-movetoworkspacesilent, 5
bindp = $mainMod SHIFT CTRL, 6, split-movetoworkspacesilent, 6
bindp = $mainMod SHIFT CTRL, 7, split-movetoworkspacesilent, 7
bindp = $mainMod SHIFT CTRL, 8, split-movetoworkspacesilent, 8
bindp = $mainMod SHIFT CTRL, 9, split-movetoworkspacesilent, 9
bindp = $mainMod SHIFT CTRL, 0, split-movetoworkspacesilent, 10

# TODO: Show hidden window icon in waybar, keybinds to bring back all the hidden windows regardless
# which workspace.
# Minimize the current window, or bring back all hidden window for the current workspace
bindp = $mainMod, w, exec, $HOME/Development/script/gui/hyprland/min-max.sh min
bindp = $mainMod, e, exec, $HOME/Development/script/gui/hyprland/min-max.sh maxall

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmp = $mainMod, mouse:272, movewindow
bindmp = $mainMod, mouse:273, resizewindow


# Multihead #########################
bindp = $mainMod CTRL, j, focusmonitor, +1
bindp = $mainMod CTRL, k, focusmonitor, -1

bindp = $mainMod, o, exec, hyprctl dispatch movewindow mon:$(( ($(hyprctl -j monitors | jaq -r '.[] | select(.focused == true) | .id') + 1) % 2 ))



bind = SUPER,F9,pass,^(com\.obsproject\.Studio)$
bind = SUPER,F10,pass,^(com\.obsproject\.Studio)$
bind = SUPER,F11,pass,^(com\.obsproject\.Studio)$
bind = SUPER,F12,pass,^(com\.obsproject\.Studio)$
