source = ~/.config/hypr/subconfig/env.conf
source = ~/.config/hypr/themes/rose-pine.conf
source = ~/.config/hypr/subconfig/autostart.conf
source = ~/.config/hypr/subconfig/keybinding.conf

# monitor = NAME, RESOLUTION, POSITION, SCALE, [mirror <NAME>]
monitor=eDP-1,1920x1080@60,0x0,1
monitor=HDMI-A-2,preferred,auto,1
# monitor=HDMI-A-2, 1920x1080@60, auto, 1, mirror, eDP-1

misc {
	# render_ahead_of_time = true
	disable_splash_rendering = false
	disable_hyprland_logo = true
	vfr = true
	vrr = 2
	disable_autoreload = true
	# wake up the monitors if the mouse moves when DPMS is set to off
	mouse_move_enables_dpms = true
	# wake up the monitors if the a key is pressed when DPMS is set to off
	key_press_enables_dpms = true
	# no_direct_scanout = true
}

render {
	# explicit_sync = 2
	# direct_scanout = true
}

binds {
	workspace_back_and_forth = false
}

input {
    kb_layout=us
    kb_variant=
    kb_model=
	# kb_options=caps:swapescape
	kb_options=caps:escape
    kb_rules=
	accel_profile=adaptive

    follow_mouse=1

    sensitivity=0
}

device {
	# disable trackpad on my thinkpad 
    name=synaptics-tm3276-022
    enabled=false
}

general {
    gaps_in=5
    gaps_out=15
    border_size=4
    # col.active_border=0xff1e1e2e 0xff1e1e2e 45deg
    # col.inactive_border=0xffeff1f5 
	col.active_border = $rose $pine $love $iris 90deg
	col.inactive_border = $overlay

    layout=master
}

decoration {
    rounding=10

	shadow {
		enabled = false
		range = 4
		render_power = 3
		color = rgba(1a1a1aee)
	}

	blur {
		enabled = true
		size = 4
		passes = 1
		new_optimizations = true
		ignore_opacity = false
		popups = false
	}
}

animations {
    enabled = true

	# Credit: sansroot
	# https://github.com/sansroot/hypr-dots
	bezier = winIn, 0.1, 1.0, 0.1, 1.0
	bezier = winOut, 0.1, 1.0, 0.1, 1.0
	bezier = smoothOut, 0.5, 0, 0.99, 0.99
	bezier = layerOut,0.23,1,0.32,1
	animation = windowsIn, 1, 7, winIn, slide
	animation = windowsOut, 1, 3, smoothOut, slide
	animation = windowsMove, 1, 7, winIn, slide
	animation = workspacesIn, 1, 8, winIn, slide
	animation = workspacesOut, 1, 8, winOut, slide
	animation = layersIn, 1, 10, winIn, slide
	animation = layersOut, 1, 3, layerOut, popin 50%
}

master {
    new_status = slave
	new_on_top = false
}

gestures {
    workspace_swipe = on
}

group {
	col.border_active = rgba(fab387ff) rgba(fab387ff) 45deg

	groupbar {
		font_family = "CodeNewRoman Nerd Font Propo"
		font_size = 10
		height = 16
		col.active = rgba(D19097ff)
		col.inactive = rgba(1717179A)
		gradients = true
	}
}

debug {
	suppress_errors = false
}


# Floating window ##########################################
# Nextcloud system tray window
windowrule = move 3% 4.9%,title:Nextcloud
windowrulev2 = float,class:^(com.nextcloud.*.nextcloud)$
windowrulev2 = size 25% 50%,class:^(com.nextcloud.*.nextcloud)$

# Firefox (zen browser) picture in picture window
# TODO: The initial window title for Firefox (zen) Page Info page
# is empty, which makes this rule useless.
# https://github.com/hyprwm/Hyprland/discussions/8078
# windowrule = float, class:zen, title:Page Info.*
# windowrulev2 = size 997 658, class:zen, title:Page Info.*
windowrulev2 = float,title:^(Picture-in-Picture)$
windowrulev2 = size 340 255,title:^(Picture-in-Picture)$
windowrulev2 = move 1560 804,title:^(Picture-in-Picture)$
# Console Window
windowrule = float, class:zen, title:Parent process Browser Console
windowrulev2 = size 997 658, class:zen, title:Parent process Browser Console

# Other programs that default to float 
windowrule = float,title:foot-float
windowrule = size 40% 50%,title:foot-float
windowrule = center,title:foot-float
windowrulev2 = float, class:^(nl.hjdskes.gcolor3)$
windowrule = float, class:zen, title:Library
windowrulev2 = size 997 658, class:zen, title:Library


# Change properties ########################################
# No animation for ueberzug
windowrule=animation slide,title:^(ueberzug).*
# windowrule=noanim,title:^(ueberzug).*
windowrule=noanim,title:^(ueberzug).*

# TODO: alawys open zathura instances in a group. Not an easy thing to
# automatically add new windows to this group at the moment.
# Currently, only instances launched at once will go into a group, or it
# can be manually dragged into the group.
windowrule = group set, class:^(org.pwmt.zathura).*
# windowrule = opacity 0.92, class:^(org.pwmt.zathura).*

windowrule = noblur,title:gns3-kitty
windowrule = noblur,initialTitle:negative:rofi - powermenu

# Quick fix, mpv goes black when full screen on second monitor
windowrule = content none, class:mpv


# Layer rules ##############################################
layerrule = noanim, hyprpicker
