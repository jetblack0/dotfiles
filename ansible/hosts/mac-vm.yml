---
# Linux parallels vm
# ---------------------------------------------
#     ansible-playbook ansible/base.yml -e @ansible/hosts/mac-vm.yml

# Packages
# ---------------------------------------------
packages_exclude:
  - ollama
  - opencode
  - steampipe


# Displays
# ---------------------------------------------
monitors:
  - output: Virtual-1
    mode: "2560x1600@60"
    position: auto
    scale: 1.6

# Xft.dpi for xwayland apps: 96 * scale.
xwayland_dpi: 154

# the parallels virtio-gpu advertises a bogus preferred mode, so the
# greeter renders tiny and blurry unless pinned to the real panel. Real
# hardware reads EDID and needs none of this.
greeter_output:
  width: 2560
  height: 1600
  scale: 1.6
