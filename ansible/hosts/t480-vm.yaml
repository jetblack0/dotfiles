---
# qemu lab vm on the t480
# ---------------------------------------------
#     ansible-playbook ansible/base.yml -e @ansible/hosts/t480-vm.yaml


# Graphics
# ---------------------------------------------
# Software vulkan. Without a gpu_vendor, pacman picks steam's vulkan driver
# by alphabet and installs nvidia's, which cannot work here.
gpu_vendor: vm


# Displays
# ---------------------------------------------
monitors:
  - output: Virtual-1
    mode: preferred
    position: auto
    scale: 1.2

# Xft.dpi for xwayland apps: 96 * scale.
xwayland_dpi: 115

lockscreen_height: 900

# Noctalia media widget cap.
media_max_length: 150

greeter_output:
  width: 1920
  height: 1080
  scale: 1.2

greeter_env:
  WLR_NO_HARDWARE_CURSORS: 1

# Boot straight into the desktop, so a restart over ssh needs no password.
greeter_autologin_user: dev
