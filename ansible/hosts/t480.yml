# Thinkpad T480
# ---------------------------------------------
#     ansible-playbook ansible/base.yml -e @ansible/hosts/t480.yml


# Noctalia
# ---------------------------------------------
wallpaper_directory: "~/assets/media/pics/wallpaper/landscape"
# gpu-screen-recorder creates it if missing
recording_directory: "~/assets/media/vids/recording"


# Graphics
# ---------------------------------------------
# UHD 620.
gpu_vendor: intel


# Displays
# ---------------------------------------------
monitors:
  - output: eDP-1
    mode: preferred
    position: auto
    scale: 1.2
  - output: HDMI-A-2
    mode: "1920x1080@60"
    position: auto
    scale: 1

# Xft.dpi for xwayland apps: 96 * scale.
xwayland_dpi: 115

lockscreen_height: 900

# Noctalia media widget cap.
media_max_length: 150

greeter_output:
  width: 1920
  height: 1080
  scale: 1.2


# Devices
# ---------------------------------------------
# input_devices:
#   tpps/2-ibm-trackpoint:
#     sensitivity: 0
#     accel_profile: adaptive
#   synaptics-tm3276-022:
#     sensitivity: 0
#     accel_profile: adaptive
#   logitech-g-pro--1:
#     sensitivity: 0
#     accel_profile: adaptive


# Miscs
# ---------------------------------------------
singbox_dns_override: true
