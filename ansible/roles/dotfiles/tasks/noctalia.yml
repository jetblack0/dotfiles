---
# Per-host noctalia values, rendered next to the synced config.
#
# Noctalia merges every ~/.config/noctalia/*.toml alphabetically and the
# later file's scalars win, so a zz- prefixed overlay lands on top of
# config.toml without touching the rest of its [wallpaper] table.

- name: Render the noctalia host overlay
  ansible.builtin.template:
    src: zz-host.toml.j2
    dest: "{{ dotfiles_dest }}/noctalia/zz-host.toml"
    mode: "0644"
  when: "'noctalia' not in (dotfiles_mask[ansible_facts['os_family'] | lower] | default([]))"

# Local plugins load from XDG data.
- name: Install the noctalia plugins
  when: "'noctalia' not in (dotfiles_mask[ansible_facts['os_family'] | lower] | default([]))"
  block:
    - name: Ensure the noctalia plugin directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.local/share/noctalia/plugins"
        state: directory
        mode: "0755"

    - name: Copy the plugins from the repo
      ansible.builtin.copy:
        src: "{{ dotfiles_src | dirname }}/share/noctalia/plugins/"
        dest: "{{ ansible_facts['user_dir'] }}/.local/share/noctalia/plugins/"
        mode: preserve
        remote_src: true

- name: Install the nerd glyph list
  ansible.builtin.copy:
    src: "{{ dotfiles_src | dirname }}/share/nerd-glyphs/"
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/nerd-glyphs/"
    mode: preserve
    remote_src: true
  when: "'noctalia' not in (dotfiles_mask[ansible_facts['os_family'] | lower] | default([]))"
