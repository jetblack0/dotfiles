---
# GTK files that live in XDG data, not ~/.config.

- name: Install the emacs-lite key theme
  when: "'gtk-3.0' not in (dotfiles_mask[ansible_facts['os_family'] | lower] | default([]))"
  block:
    - name: Ensure the themes directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.local/share/themes"
        state: directory
        mode: "0755"

    - name: Copy the key theme from the repo
      ansible.builtin.copy:
        src: "{{ dotfiles_src | dirname }}/share/themes/emacs-lite"
        dest: "{{ ansible_facts['user_dir'] }}/.local/share/themes/"
        mode: preserve
        remote_src: true
