---
# Mirror the deployed gtk ini into gsettings.

- name: Align gsettings with the deployed gtk settings
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - "'gtk-3.0' not in (dotfiles_mask[ansible_facts['os_family'] | lower] | default([]))"
    - ansible_env.DBUS_SESSION_BUS_ADDRESS is defined
  vars:
    gtk_ini: "{{ dotfiles_src }}/gtk-3.0/settings.ini"
    gtk_interface:
      icon-theme: "{{ lookup('ini', 'gtk-icon-theme-name', section='Settings', file=gtk_ini) }}"
      cursor-theme: "{{ lookup('ini', 'gtk-cursor-theme-name', section='Settings', file=gtk_ini) }}"
      cursor-size: "{{ lookup('ini', 'gtk-cursor-theme-size', section='Settings', file=gtk_ini) }}"
  block:
    - name: Read the current interface settings
      ansible.builtin.command: "gsettings get org.gnome.desktop.interface {{ item.key }}"
      changed_when: false
      register: dotfiles_gsettings
      loop: "{{ gtk_interface | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Set the ones that drifted
      ansible.builtin.command: >-
        gsettings set org.gnome.desktop.interface
        {{ item.item.key }} '{{ item.item.value }}'
      when: (item.stdout | trim | regex_replace("^'(.*)'$", '\1')) != (item.item.value | string)
      loop: "{{ dotfiles_gsettings.results }}"
      loop_control:
        label: "{{ item.item.key }}"
