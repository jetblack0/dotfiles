---
# Per-host display rules, rendered for conf/monitors.lua to pick up.

- name: Render the host's monitor rules
  when:
    - monitors is defined
    - monitors | length > 0
    - "'hypr' not in (dotfiles_mask[ansible_facts['os_family'] | lower] | default([]))"
  block:
    - name: Ensure the hypr state directory exists
      ansible.builtin.file:
        path: "{{ dotfiles_state }}/hypr"
        state: directory
        mode: "0755"

    - name: Write the monitor rules
      ansible.builtin.template:
        src: monitors.lua.j2
        dest: "{{ dotfiles_state }}/hypr/monitors.lua"
        mode: "0644"

- name: Render the host's xresources
  when:
    - xwayland_dpi is defined
    - "'hypr' not in (dotfiles_mask[ansible_facts['os_family'] | lower] | default([]))"
  block:
    - name: Ensure the hypr state directory exists
      ansible.builtin.file:
        path: "{{ dotfiles_state }}/hypr"
        state: directory
        mode: "0755"

    - name: Write the xresources
      ansible.builtin.template:
        src: xresources.j2
        dest: "{{ dotfiles_state }}/hypr/xresources"
        mode: "0644"

- name: Seed the screenshot directory
  when:
    - "'hypr' not in (dotfiles_mask[ansible_facts['os_family'] | lower] | default([]))"
  block:
    - name: Ensure the hypr state directory exists
      ansible.builtin.file:
        path: "{{ dotfiles_state }}/hypr"
        state: directory
        mode: "0755"

    # Seeded from the per-host var, but force:no means we create it once and
    # never overwrite -- so `pwd > ~/.local/state/hypr/screenshot-dir` sticks
    # across redeploys. Empty resolves to XDG Pictures in screenshot.sh.
    - name: Write the screenshot directory, only if absent
      ansible.builtin.copy:
        dest: "{{ dotfiles_state }}/hypr/screenshot-dir"
        content: "{{ screenshot_directory }}\n"
        mode: "0644"
        force: false
