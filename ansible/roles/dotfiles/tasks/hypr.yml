---
# Per-host display rules, rendered for conf/monitors.lua to pick up.

- name: Render the host's monitor rules
  when:
    - monitors is defined
    - monitors | length > 0
    - "'hypr' not in (dotfiles_mask[ansible_facts['os_family'] | lower] | default([]))"
  block:
    - name: Ensure the hypr state directory exists
      ansible.builtin.file:
        path: "{{ dotfiles_state }}/hypr"
        state: directory
        mode: "0755"

    - name: Write the monitor rules
      ansible.builtin.template:
        src: monitors.lua.j2
        dest: "{{ dotfiles_state }}/hypr/monitors.lua"
        mode: "0644"
