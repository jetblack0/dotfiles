---
# Resolved relative to the playbook so that both push (ansible-playbook)
# and pull (ansible-pull) modes find it.
dotfiles_src: "{{ playbook_dir | dirname }}/config/config"

# Where the managed directories land.
dotfiles_dest: "{{ ansible_facts['user_dir'] }}/.config"

# State the config reads but the sync must never overwrite.
dotfiles_state: "{{ ansible_facts['user_dir'] }}/.local/state"

# Directories about to be changed are snapshotted here first, one folder per
# playbook run (restore.yml puts them back).
dotfiles_backup_root: "{{ ansible_facts['user_dir'] }}/.local/state/dotfiles/backup"
dotfiles_backup: "{{ dotfiles_backup_root }}/{{ ansible_facts['date_time']['iso8601_basic_short'] }}"

# Refuse to sync while a managed file is owned by someone else. The sync
# self-heals content and mode drift but cannot see or chown foreign
# ownership without root, so it fails loudly instead of certifying a
# deployment where the shell may not be able to write its own config.
dotfiles_assert_ownership: true

# Directories masked from a given platform.
dotfiles_mask:
  archlinux:
    - Kvantum
    - X11
    - dunst
    - gtk-2.0
    - qt5ct
    - waybar
  darwin:
    - dunst
    - fontconfig
    - foot
    - gtk-2.0
    - gtk-3.0
    - gtk-4.0
    - hypr
    - Kvantum
    - noctalia
    - nsxiv
    - qt5ct
    - rofi
    - systemd
    - waybar
    - X11
    - swayimg

# Per-host preferences, rendered into the noctalia overlay.
wallpaper_directory: "~/assets/media/pics/wallpaper/landscape"
# Empty means noctalia's default, the XDG Pictures directory.
screenshot_directory: ""
