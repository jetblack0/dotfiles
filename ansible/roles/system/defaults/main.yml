---
# The repo's etc/ tree.
system_src: "{{ playbook_dir | dirname }}/config/etc"

# Where sing-box reads its profiles.
singbox_profile_dir: "{{ ansible_facts['user_dir'] }}/.config/sing-box"

# Refresh the subscription outbounds on a timer. Off by default.
singbox_providers_timer: false
singbox_providers_schedule: daily
