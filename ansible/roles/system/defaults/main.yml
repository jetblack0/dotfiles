---
# The repo's etc/ tree.
system_src: "{{ playbook_dir | dirname }}/config/etc"

system_docker_group: false

# Copy the firmware's windows licence table (MSDM) to
# /var/lib/libvirt/oem/MSDM for a windows guest. Off by default: the windows
# vm does not live in the repo.
system_libvirt_oem_key: false

# Where sing-box reads its profiles.
singbox_profile_dir: "{{ ansible_facts['user_dir'] }}/.config/sing-box"

# Refresh the subscription outbounds on a timer. Off by default.
singbox_providers_timer: false
singbox_providers_schedule: daily

# Point the system resolver at the sing-box tun (NetworkManager global dns).
singbox_dns_override: false
singbox_dns: 172.18.0.2
