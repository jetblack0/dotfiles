---
- name: Install the system-wide zsh environment
  become: true
  ansible.builtin.copy:
    src: "{{ system_src }}/zsh/zshenv"
    dest: /etc/zsh/zshenv
    mode: "0644"
    remote_src: true

- name: Change the login shell to zsh
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/zsh

# sshd_config includes this directory from its second line and takes the
# first value it sees, so 10- outranks the stock drop-ins. The service is
# deliberately left disabled: start it with `systemctl start sshd` when a
# machine needs to be reachable.
- name: Allow the playbook user to log in over ssh with a password
  become: true
  ansible.builtin.copy:
    content: |
      PasswordAuthentication yes
      PermitRootLogin no
    dest: /etc/ssh/sshd_config.d/10-password-login.conf
    mode: "0644"

- name: Point sh at dash
  become: true
  ansible.builtin.file:
    src: dash
    dest: /usr/bin/sh
    state: link
    force: true

- name: Ensure the pacman hook directory exists
  become: true
  ansible.builtin.file:
    path: /etc/pacman.d/hooks
    state: directory
    mode: "0755"

# The bash package owns /usr/bin/sh, so every bash upgrade resets the
# symlink; this hook points it back at dash after each transaction.
- name: Keep sh pointing at dash across bash upgrades
  become: true
  ansible.builtin.copy:
    src: dash-as-sh.hook
    dest: /etc/pacman.d/hooks/dash-as-sh.hook
    mode: "0644"

# The regexps match the stock commented lines as well as values the user
# already set, so these converge no matter what state the file is in.
- name: Enable the en_US locale
  become: true
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*en_US\.UTF-8 UTF-8'
    line: en_US.UTF-8 UTF-8
  register: system_locale_gen

- name: Check which locales are generated
  ansible.builtin.command: locale -a
  register: system_locales
  changed_when: false
  check_mode: false

- name: Generate the en_US locale
  become: true
  ansible.builtin.command: locale-gen
  when: system_locale_gen is changed or system_locales.stdout is not search("en_US.utf8")

- name: Default LANG to the en_US locale
  become: true
  ansible.builtin.lineinfile:
    path: /etc/locale.conf
    regexp: '^LANG='
    line: LANG=en_US.UTF-8
    create: true
    mode: "0644"

- name: Turn on pacman colors
  become: true
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^#?\s*Color'
    line: Color
    insertafter: '^\[options\]'

- name: Download packages in parallel
  become: true
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^#?\s*ParallelDownloads'
    line: ParallelDownloads = 5
    insertafter: '^\[options\]'

# makepkg sources /etc/makepkg.conf.d/*.conf on its own; $(nproc) is
# evaluated at build time.
- name: Let makepkg build on all cores
  become: true
  ansible.builtin.copy:
    content: |
      MAKEFLAGS="-j$(nproc)"
    dest: /etc/makepkg.conf.d/makeflags.conf
    mode: "0644"

- name: Trim the ssd weekly
  become: true
  ansible.builtin.systemd_service:
    name: fstrim.timer
    enabled: true
    state: "{{ (ansible_facts['service_mgr'] == 'systemd') | ternary('started', omit) }}"

- name: Ensure the journald drop-in directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

# the default cap is 10% of the filesystem, up to 4G of logs.
- name: Cap the journal size
  become: true
  ansible.builtin.copy:
    content: |
      [Journal]
      SystemMaxUse=500M
    dest: /etc/systemd/journald.conf.d/size.conf
    mode: "0644"

# The battery-threshold Noctalia plugin writes charge_control_end_threshold
# directly without sudo.  
- name: Create the battery_ctl group
  become: true
  ansible.builtin.group:
    name: battery_ctl
    system: true

- name: Put the user in battery_ctl
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: battery_ctl
    append: true

- name: Grant battery_ctl write access to the charge threshold
  become: true
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/99-battery-threshold.rules
    mode: "0644"
    content: |
      # Managed by ansible. Lets the noctalia battery-threshold plugin write
      # the charge limit as the desktop user.
      SUBSYSTEM=="power_supply", KERNEL=="BAT*", \
          RUN+="/usr/bin/chgrp battery_ctl /sys$devpath/charge_control_end_threshold", \
          RUN+="/usr/bin/chmod g+w /sys$devpath/charge_control_end_threshold"
  register: system_battery_udev

- name: Reload the udev rules
  become: true
  ansible.builtin.command:
    cmd: udevadm control --reload-rules
  changed_when: true
  when: system_battery_udev is changed

- name: Turn on bluetooth at boot
  become: true
  ansible.builtin.systemd_service:
    name: bluetooth.service
    enabled: true

- name: Boot into NetworkManager
  become: true
  ansible.builtin.systemd_service:
    name: NetworkManager.service
    enabled: true

# Masked
- name: Retire systemd-networkd
  become: true
  ansible.builtin.systemd_service:
    name: systemd-networkd.service
    enabled: false
    masked: true

- name: Retire the systemd-networkd trigger sockets
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
  loop:
    - systemd-networkd.socket
    - systemd-networkd-varlink.socket
    - systemd-networkd-varlink-metrics.socket
    - systemd-networkd-resolve-hook.socket

# Boot into noctalia-greeter via greetd.
- name: Install the greetd config
  become: true
  ansible.builtin.copy:
    src: "{{ system_src }}/greetd/config.toml"
    dest: /etc/greetd/config.toml
    mode: "0644"
    remote_src: true

- name: Boot into the greeter
  become: true
  ansible.builtin.systemd_service:
    name: greetd.service
    enabled: true

# The dir and its greeter owner come from the noctalia-greeter package
# hook (packages runs before this role).
- name: Install the greeter config
  become: true
  ansible.builtin.template:
    src: greeter.toml.j2
    dest: /var/lib/noctalia-greeter/greeter.toml
    owner: greeter
    group: greeter
    mode: "0644"

- name: Sync the greeter appearance without a password prompt
  become: true
  ansible.builtin.copy:
    src: noctalia-greeter.rules
    dest: /etc/polkit-1/rules.d/49-noctalia-greeter.rules
    mode: "0644"

# Console
# ---------------------------------------------
- name: Ensure the console keymap directory exists
  become: true
  ansible.builtin.file:
    path: /etc/kbd
    state: directory
    mode: "0755"

- name: Render the console keymap with capslock as escape
  ansible.builtin.shell:
    cmd: |
      set -eu
      gunzip -c /usr/share/kbd/keymaps/i386/qwerty/us.map.gz
      echo 'keycode 58 = Escape'
    executable: /bin/sh
  register: system_console_keymap_src
  changed_when: false
  check_mode: false

- name: Install the console keymap
  become: true
  ansible.builtin.copy:
    content: "{{ system_console_keymap_src.stdout }}\n"
    dest: /etc/kbd/us.map
    mode: "0644"
  register: system_console_keymap

- name: Set the console font
  become: true
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: '^#?\s*FONT='
    line: FONT=ter-d24b
    create: true
    mode: "0644"
  register: system_console_font

- name: Point the console keymap at the repo's
  become: true
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: '^#?\s*KEYMAP='
    line: KEYMAP=/etc/kbd/us.map
    create: true
    mode: "0644"
  register: system_console_map

- name: Apply the console font and keymap now
  become: true
  ansible.builtin.systemd_service:
    name: systemd-vconsole-setup.service
    state: restarted
  when: >
    (system_console_keymap is changed
    or system_console_font is changed
    or system_console_map is changed)
    and ansible_facts['service_mgr'] == 'systemd'

- name: Silence the pc speaker
  become: true
  ansible.builtin.copy:
    content: |
      blacklist pcspkr
    dest: /etc/modprobe.d/nobeep.conf
    mode: "0644"

- name: Wire up sing-box
  ansible.builtin.include_tasks: sing-box.yml
