---

- name: Create the sing-box profile directory
  ansible.builtin.file:
    path: "{{ singbox_profile_dir }}"
    state: directory
    mode: "0700"

- name: Ensure the sing-box drop-in directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/sing-box@.service.d
    state: directory
    mode: "0755"

- name: Point sing-box at the profiles in the home directory
  become: true
  ansible.builtin.template:
    src: sing-box-override.conf.j2
    dest: /etc/systemd/system/sing-box@.service.d/override.conf
    mode: "0644"
  register: singbox_override

- name: Reload systemd so the drop-in takes effect
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: singbox_override is changed
