---
# Package manager
# ---------------------------------------------
# Configured before anything is installed.
- name: Turn on the pacman qol options
  become: true
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^#?\s*{{ item }}'
    line: "{{ item }}"
    insertafter: '^\[options\]'
  loop:
    - Color
    - CheckSpace
    - VerbosePkgLists
    - ILoveCandy

- name: Download packages in parallel
  become: true
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^#?\s*ParallelDownloads'
    line: ParallelDownloads = 5
    insertafter: '^\[options\]'

# makepkg sources /etc/makepkg.conf.d/*.conf on its own; $(nproc) is
# evaluated at build time.
- name: Let makepkg build on all cores
  become: true
  ansible.builtin.copy:
    content: |
      MAKEFLAGS="-j$(nproc)"
    dest: /etc/makepkg.conf.d/makeflags.conf
    mode: "0644"


# Repos
# ---------------------------------------------
- name: Enable the multilib repository
  become: true
  ansible.builtin.replace:
    path: /etc/pacman.conf
    regexp: '^#\[multilib\]\n#Include = (.*)$'
    replace: '[multilib]\nInclude = \1'
  when: ansible_facts['architecture'] == 'x86_64'

# Packages
# ---------------------------------------------
- name: Check that gpu_vendor names a known driver set
  ansible.builtin.assert:
    that: gpu_vendor in packages_gpu_drivers
    fail_msg: >-
      Unknown gpu_vendor '{{ gpu_vendor }}': pick one of
      {{ packages_gpu_drivers.keys() | list | join(', ') }}.
  when: gpu_vendor | length > 0

- name: Install packages with pacman
  become: true
  community.general.pacman:
    name: "{{ packages_pacman }}"
    state: present
    update_cache: true
  register: packages_pacman_install
  until: packages_pacman_install is succeeded
  retries: 3
  delay: 10

- name: Install SF Pro
  ansible.builtin.include_tasks: sf-pro.yml
  when: "'apple-fonts' not in packages_exclude"

# AUR
# ---------------------------------------------
- name: Install AUR build prerequisites
  become: true
  community.general.pacman:
    name:
      - base-devel
      - git
      - sudo
    state: present

- name: Create the AUR build user
  become: true
  ansible.builtin.user:
    name: aur_builder
    system: true
    create_home: true
    home: /var/lib/aur_builder

- name: Allow the AUR build user to run pacman
  become: true
  ansible.builtin.copy:
    content: "aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman\n"
    dest: /etc/sudoers.d/aur_builder
    mode: "0440"
    validate: visudo -cf %s

- name: Check whether paru is installed
  ansible.builtin.command: paru --version
  register: packages_paru_check
  changed_when: false
  failed_when: false
  check_mode: false

# Built from source rather than paru-bin.
- name: Build and install paru
  become: true
  become_user: aur_builder
  environment: "{{ packages_proxy_env }}"
  ansible.builtin.shell:
    cmd: |
      set -e
      rm -rf "$HOME/paru"
      git clone https://aur.archlinux.org/paru.git "$HOME/paru"
      cd "$HOME/paru"
      makepkg -si --noconfirm
      rm -rf "$HOME/paru"
    creates: /usr/bin/paru
  when: packages_paru_check.rc != 0

# Only ever install what is missing: handing paru the full list would
# rebuild a package on every AUR version bump, turning each run into a
# surprise upgrade. Updates stay a deliberate `paru -Syu`.
- name: Check which AUR packages are already installed
  ansible.builtin.command:
    argv: "{{ ['pacman', '-Qq'] + packages_aur }}"
  register: packages_aur_query
  changed_when: false
  failed_when: false
  check_mode: false
  when: packages_aur | length > 0

- name: Install packages from the AUR
  become: true
  become_user: aur_builder
  environment: "{{ packages_proxy_env }}"
  ansible.builtin.command:
    argv: "{{ ['paru', '-S', '--needed', '--noconfirm'] + packages_aur_missing }}"
  vars:
    packages_aur_missing: "{{ packages_aur | difference(packages_aur_query.stdout_lines | default([])) }}"
  when: packages_aur | length > 0 and packages_aur_missing | length > 0
  register: packages_aur_install
  until: packages_aur_install is succeeded
  retries: 3
  delay: 10
