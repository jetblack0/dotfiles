---
# One entry per tool. `name` is the package name under every manager
# unless a manager key says otherwise:
#   pacman: <name> | false    different name on arch / not installed there
#   aur:    <name>            comes from the AUR instead of pacman
#   brew:   <name> | false    different name on macos / not installed there
#   cask:   <name>            homebrew cask instead of a formula
#   tap:    <user/repo>       third-party tap providing the formula
# The per-manager lists are derived in vars/main.yml.
# ---------------------------------------------
packages:
  # shell, terminal & files
  - { name: bat }
  - { name: dash, brew: false } # /usr/bin/sh on arch
  - { name: dua-cli }
  - { name: eza }
  - { name: fd }
  - { name: fzf }
  - { name: jq }
  - { name: kitty, cask: kitty }
  - { name: kitty-terminfo, brew: false }
  - { name: ouch }
  - { name: ripgrep }
  - { name: tmux }
  - { name: yazi }
  - { name: zoxide }

  # fonts
  - { name: inter-font, cask: font-inter }
  - { name: noto-fonts-cjk, cask: font-noto-sans-cjk }
  - { name: otf-codenewroman-nerd, brew: false }
  - { name: ttf-jetbrains-mono-nerd, cask: font-jetbrains-mono-nerd-font }
  - { name: ttf-udev-gothic, aur: ttf-udev-gothic, cask: font-udev-gothic-nf }

  # system monitors & info
  - { name: bottom }
  - { name: btop }
  - { name: fastfetch }

  # git & code
  - { name: git }
  - { name: git-delta }
  - { name: lazygit }
  - { name: tokei }

  # editor & docs
  - { name: neovim }
  - { name: glow }
  - { name: tealdeer }

  # documents
  - { name: zathura, tap: homebrew-zathura/zathura }
  - { name: zathura-pdf-poppler, tap: homebrew-zathura/zathura }
  - { name: girara, pacman: false, tap: homebrew-zathura/zathura }

  # mail & feeds
  - { name: aerc }
  - { name: newsboat }

  # secrets
  - { name: pass }

  # basics macOS already ships
  - { name: curl, brew: false }
  - { name: diffutils, brew: false } # git/nvim shell out to diff
  - { name: man-db, brew: false }
  - { name: man-pages, brew: false }
  - { name: openssh, brew: false }
  - { name: rsync, brew: false }
  - { name: unzip, brew: false } # mason unpacks LSP archives with it
  - { name: zsh, brew: false }

  # nvim toolchain: mason installs LSPs with these.
  - { name: jdk17-openjdk, brew: false }
  - { name: nodejs, brew: node }
  - { name: npm, brew: false } # brew's node ships npm
  - { name: python }
  - { name: python-pip, brew: false } # brew's python ships pip
  - { name: tree-sitter-cli } # NOT brew's tree-sitter: that is library-only

  # python tooling
  - { name: uv }

  # cloud & devops
  - { name: ansible }
  - { name: argocd }
  - { name: aws-cli, brew: awscli }
  - { name: colima, pacman: false } # backs the docker cli on macos
  - { name: docker } # engine on arch, plain cli on macos
  - { name: docker-compose }
  - { name: helm }
  - { name: kubectl }
  - { name: opentofu }
  - { name: steampipe, aur: steampipe-bin }

  # ai
  - { name: claude-code, aur: claude-code, cask: claude-code@latest }
  - { name: ollama }
  - { name: opencode, tap: anomalyco/tap }

  # desktop
  - { name: zen-browser, aur: zen-browser-bin, cask: zen }
  - { name: noctalia, brew: false }
  - { name: libnotify, brew: false }
  - { name: capitaine-cursors, brew: false }
  - { name: tela-circle-icon-theme, aur: tela-circle-icon-theme-black-git, brew: false }

  # audio. arch's user presets enable the sockets at install, no wiring needed
  - { name: pipewire, brew: false }
  - { name: wireplumber, brew: false } # the session manager; pipewire is inert without one
  - { name: pipewire-pulse, brew: false } # pulse compat, what apps actually speak
  - { name: rtkit, brew: false } # realtime audio threads; without it audio can crackle under load
  - { name: cava }

  # portals
  - { name: xdg-desktop-portal-hyprland, brew: false }
  - { name: xdg-desktop-portal-gtk, brew: false } # file chooser + settings backends

  - { name: hyprpicker, brew: false }
  - { name: grim, brew: false }
  - { name: slurp, brew: false }
  - { name: tesseract, brew: false }
  - { name: tesseract-data-eng, brew: false }
  - { name: wl-clipboard, brew: false } # wl-copy
  - { name: libnotify, brew: false } # notify-send

  # misc
  - { name: xdg-ninja, aur: xdg-ninja }

# Entries to skip by canonical name, e.g. on a distro that lacks them.
# ---------------------------------------------
packages_exclude: []
