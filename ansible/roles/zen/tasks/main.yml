---
- name: Fail on unsupported platforms
  ansible.builtin.fail:
    msg: >-
      Unsupported platform '{{ ansible_facts['os_family'] }}':
      this playbook only targets Arch Linux and macOS.
  when: ansible_facts['os_family'] not in ['Archlinux', 'Darwin']

- name: Remember which anatomy applies
  ansible.builtin.set_fact:
    zen_os: "{{ ansible_facts['os_family'] | lower }}"

- name: Check whether zen has a profile
  ansible.builtin.command:
    argv: "{{ zen_resolver }}"
  register: zen_probe
  changed_when: false
  check_mode: false
  failed_when: false

- name: Let zen create its profile
  ansible.builtin.command:
    argv:
      - "{{ zen_bin[zen_os] }}"
      - --headless
      - --screenshot
      - "{{ zen_warmup_shot }}"
      - about:blank
  environment:
    MOZ_HEADLESS: "1"
  when: zen_probe.rc != 0

- name: Remove the warm-up screenshot
  ansible.builtin.file:
    path: "{{ zen_warmup_shot }}"
    state: absent
  when: zen_probe.rc != 0

- name: Resolve the profile zen uses
  ansible.builtin.command:
    argv: "{{ zen_resolver }}"
  register: zen_resolved
  changed_when: false
  check_mode: false
  failed_when: zen_resolved.rc != 0

- name: Remember the profile directory
  ansible.builtin.set_fact:
    zen_profile: "{{ zen_resolved.stdout }}"

- name: Install the zen settings
  ansible.builtin.copy:
    src: "{{ zen_src }}/{{ item.src }}"
    dest: "{{ zen_profile }}/{{ item.dest }}"
    mode: "0644"
    remote_src: true
  loop:
    - { src: user.js, dest: user.js }
    - { src: "{{ zen_shortcuts[zen_os] }}", dest: zen-keyboard-shortcuts.json }
  loop_control:
    label: "{{ item.src }}"

- name: Ensure the distribution directory exists
  become: "{{ zen_os == 'archlinux' }}"
  ansible.builtin.file:
    path: "{{ zen_policies_dir[zen_os] }}"
    state: directory
    mode: "0755"

# Declarative extension installs; wiped by app updates on macos, which the
# next converge simply puts back.
- name: Install the extension policies
  become: "{{ zen_os == 'archlinux' }}"
  ansible.builtin.copy:
    src: "{{ zen_src }}/policies.json"
    dest: "{{ zen_policies_dir[zen_os] }}/policies.json"
    mode: "0644"
    remote_src: true
